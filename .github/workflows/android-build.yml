name: Android Build

on:
  push:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

      run_emulator_tests:
        description: 'Run emulator tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

      nodejs_version:
        description: 'Pin Termux nodejs version (empty = latest from index)'
        required: false
        default: ''
        type: string

# A newer push supersedes an older queued/in-progress build on the same branch.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve build inputs
        run: |
          # workflow_dispatch provides inputs; push events do not. Default to a
          # debug build without emulator tests so every push is validated.
          echo "BUILD_TYPE=${{ inputs.build_type || 'debug' }}" >> $GITHUB_ENV
          # TEMP (revert after boot is proven): run the emulator boot test on push
          # because workflow_dispatch cannot be triggered with the current token.
          echo "RUN_EMU=${{ inputs.run_emulator_tests || 'true' }}" >> $GITHUB_ENV
          echo "NODEJS_PIN=${{ inputs.nodejs_version || '' }}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Android unit tests
        run: |
          cd tests
          npm ci
          npm run test:android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        # NOTE: setup-android@v3 only accepts cmdline-tools-version / packages /
        # license inputs; the runner image already ships the SDK, so no `with:`
        # block is needed (api-level / build-tools inputs are ignored upstream).
        uses: android-actions/setup-android@v3

      - name: Regenerate Capacitor Android project
        run: |
          rm -rf android
          npx cap add android

          # Overlay our native sources (source of truth: android-custom/)
          mkdir -p android/app/src/main/java/com/sillytavern/app
          mkdir -p android/app/src/main/res/xml
          cp android-custom/MainActivity.java android/app/src/main/java/com/sillytavern/app/
          cp android-custom/NodeJsService.java android/app/src/main/java/com/sillytavern/app/
          cp android-custom/AndroidManifest.xml android/app/src/main/
          cp android-custom/file_paths.xml android/app/src/main/res/xml/

          npx cap sync android

      - name: Bundle backend for mobile
        run: |
          echo "Creating mobile backend bundle..."
          STAGING="android/app/src/main/assets/backend"
          mkdir -p "$STAGING"

          # Server code, defaults, and the frontend it serves
          cp server.js "$STAGING/"
          cp -r src "$STAGING/"
          cp -r default "$STAGING/"
          cp -r public "$STAGING/"

          # Real dependency set, resolved from the root lockfile. A hand-written
          # subset WILL crash on boot (helmet, csrf-sync, ... are all required).
          cp package.json package-lock.json "$STAGING/"
          echo "${{ github.sha }}-${{ github.run_number }}" > "$STAGING/VERSION"

          cd "$STAGING"
          npm ci --omit=dev --no-audit --no-fund
          cd -

      - name: Provide Node.js runtime
        run: |
          # Fetch standalone Android (bionic) Node.js + its shared dependencies
          # from Termux's APT repo, verified by SHA-256 and ELF-validated.
          # Debug builds include x64 so the emulator test can boot the server.
          if [ "${{ env.BUILD_TYPE }}" = "debug" ]; then
            ABIS="arm64,armv7,x64"
          else
            ABIS="arm64,armv7"
          fi
          PIN_ARGS=""
          if [ -n "${{ env.NODEJS_PIN }}" ]; then
            PIN_ARGS="--nodejs-version ${{ env.NODEJS_PIN }}"
          fi
          bash scripts/provision-android-runtime.sh \
            --out android/app/src/main/assets/backend/nodejs \
            --abis "$ABIS" \
            $PIN_ARGS

      - name: Verify build assets
        run: |
          STAGING="android/app/src/main/assets/backend"
          echo "=== Backend bundle ==="
          ls -lh "$STAGING" | head -n 20
          [ -f "$STAGING/server.js" ] && echo "OK server.js" || (echo "MISSING server.js" && exit 1)
          [ -d "$STAGING/src" ] && echo "OK src/" || (echo "MISSING src/" && exit 1)
          [ -d "$STAGING/public" ] && echo "OK public/" || (echo "MISSING public/" && exit 1)
          [ -d "$STAGING/node_modules" ] && echo "OK node_modules/" || (echo "MISSING node_modules/" && exit 1)
          [ -f "$STAGING/VERSION" ] && echo "OK VERSION: $(cat "$STAGING/VERSION")" || (echo "MISSING VERSION" && exit 1)
          for dep in helmet csrf-sync cookie-session multer yaml ws; do
            [ -d "$STAGING/node_modules/$dep" ] && echo "OK dep: $dep" || (echo "MISSING dep: $dep" && exit 1)
          done
          echo "=== Node.js runtime ==="
          [ -f "$STAGING/nodejs/runtime-manifest.json" ] && echo "OK runtime-manifest.json" || (echo "MISSING runtime-manifest.json" && exit 1)
          cat "$STAGING/nodejs/runtime-manifest.json"
          if [ "${{ env.BUILD_TYPE }}" = "debug" ]; then
            EXPECTED_ABIS="arm64 armv7 x64"
          else
            EXPECTED_ABIS="arm64 armv7"
          fi
          for abi in $EXPECTED_ABIS; do
            [ -f "$STAGING/nodejs/$abi/node" ] && echo "OK runtime: $abi/node" || (echo "MISSING runtime: $abi/node" && exit 1)
            [ -n "$(ls "$STAGING/nodejs/$abi/lib/"*.so* 2>/dev/null)" ] && echo "OK runtime libs: $abi" || (echo "MISSING runtime libs: $abi" && exit 1)
          done
          du -sh "$STAGING/nodejs"
          echo "=== Native sources ==="
          [ -f "android/app/src/main/java/com/sillytavern/app/NodeJsService.java" ] && echo "OK NodeJsService.java" || (echo "MISSING NodeJsService.java" && exit 1)
          [ -f "android/app/src/main/res/xml/file_paths.xml" ] && echo "OK file_paths.xml" || (echo "MISSING file_paths.xml" && exit 1)

      - name: Build APK (Debug)
        if: env.BUILD_TYPE == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build release artifacts (unsigned)
        if: env.BUILD_TYPE == 'release'
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign release artifacts
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not all set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          # APKs must be signed with apksigner (v2 scheme); jarsigner would break the signature.
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass:env KEYSTORE_PASSWORD --key-pass:env KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release-signed.apk

          # App bundles are signed with jarsigner.
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

          shred -u /tmp/release.keystore || rm -f /tmp/release.keystore

      - name: Run emulator tests
        if: env.RUN_EMU == 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          # API 29: newer images (33/34) frequently hit "Timeout waiting for
          # emulator to boot" on hosted runners; 29 boots reliably and still
          # exercises x86_64 + notification channels (26+) + foreground service.
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          # NOTE: no custom emulator-options. An earlier `-partition-size 4096`
          # (meant to fit the ~350 MB APK + first-launch extraction) broke AVD
          # boot on every API level tried; the default qcow2 userdata image
          # grows on demand and the runner has ample host disk.
          # Diagnostics-first: every failure emits a ::error:: annotation (visible
          # via the Checks API) and the full trace goes to emulator-trace.txt,
          # which the next step uploads even when this step fails.
          script: |
            set +e
            TRACE=emulator-trace.txt
            : > "$TRACE"
            FAILED=0
            note() { echo "$*" | tee -a "$TRACE"; }
            fail() { echo "::error::$*"; note "FAIL: $*"; FAILED=1; }

            note "=== device sanity ==="
            adb devices | tee -a "$TRACE"
            note "boot_completed=$(adb shell getprop sys.boot_completed 2>&1 | tr -d '\r')"

            note "=== install ==="
            BUILD_TYPE=${{ env.BUILD_TYPE }}
            APK_PATH=$(ls android/app/build/outputs/apk/${BUILD_TYPE}/*.apk 2>/dev/null | head -n 1)
            if [ -z "$APK_PATH" ]; then
              fail "no APK found under android/app/build/outputs/apk/${BUILD_TYPE}/"
            else
              note "APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
              INSTALL_OUT=$(adb install "$APK_PATH" 2>&1)
              note "$INSTALL_OUT"
              echo "$INSTALL_OUT" | grep -q "^Success" || fail "adb install failed: $(echo "$INSTALL_OUT" | tr '\n' ' ' | head -c 500)"
            fi
            adb shell pm list packages 2>/dev/null | grep -i silly | tee -a "$TRACE"

            note "=== launch ==="
            START_OUT=$(adb shell am start -n com.sillytavern.app/.MainActivity 2>&1)
            note "$START_OUT"

            note "=== port forward ==="
            adb forward tcp:18080 tcp:8000 2>&1 | tee -a "$TRACE"

            note "=== health poll (up to 5 minutes) ==="
            HEALTHY=false
            for i in $(seq 1 60); do
              BODY=$(curl -sf --max-time 5 http://127.0.0.1:18080/api/health 2>/dev/null)
              if [ $? -eq 0 ]; then
                note "attempt $i: $BODY"
                HEALTHY=true
                break
              fi
              [ $((i % 6)) -eq 0 ] && note "attempt $i: not up yet"
              sleep 5
            done
            [ "$HEALTHY" = "true" ] || fail "backend never healthy after 5 min poll (port forward host:18080 -> emu:8000)"

            note "=== logcat (SillyTavern/NodeJs) ==="
            adb logcat -d 2>/dev/null | grep -E "(SillyTavern|NodeJsService)" | tail -n 200 | tee -a "$TRACE" | tail -n 20

            note "=== process check ==="
            PID=$(adb shell "pidof com.sillytavern.app" 2>/dev/null | tr -d '\r')
            if [ -n "$PID" ]; then
              note "App process is running (pid $PID)"
            else
              fail "app process NOT running"
            fi

            [ "$FAILED" = "0" ] || exit 1
            note "EMULATOR TEST PASSED"

      - name: Upload emulator trace
        # always(): the trace is most valuable precisely when the test fails.
        if: always() && env.RUN_EMU == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emulator-trace-${{ github.run_number }}
          path: emulator-trace.txt
          if-no-files-found: warn

      - name: Upload Debug APK
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-debug-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-release-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/release/*signed*.apk
          retention-days: 90

      - name: Upload Release AAB
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-release-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Generate build report
        if: always()
        run: |
          {
            echo "# Android Build Report"
            echo "Build Type: ${{ env.BUILD_TYPE }}"
            echo "Run Number: ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "## Artifacts"
            find android/app/build/outputs -name "*.apk" -o -name "*.aab" | while read -r f; do ls -lh "$f"; done
          } > build-report.md
          cat build-report.md

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.run_number }}
          path: build-report.md
          retention-days: 30
