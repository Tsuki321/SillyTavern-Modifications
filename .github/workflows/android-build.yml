name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

      run_emulator_tests:
        description: 'Run emulator tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Android unit tests
        run: |
          cd tests
          npm ci
          npm run test:android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Regenerate Capacitor Android project
        run: |
          rm -rf android
          npx cap add android

          # Overlay our native sources (source of truth: android-custom/)
          mkdir -p android/app/src/main/java/com/sillytavern/app
          mkdir -p android/app/src/main/res/xml
          cp android-custom/MainActivity.java android/app/src/main/java/com/sillytavern/app/
          cp android-custom/NodeJsService.java android/app/src/main/java/com/sillytavern/app/
          cp android-custom/AndroidManifest.xml android/app/src/main/
          cp android-custom/file_paths.xml android/app/src/main/res/xml/

          npx cap sync android

      - name: Bundle backend for mobile
        run: |
          echo "Creating mobile backend bundle..."
          STAGING="android/app/src/main/assets/backend"
          mkdir -p "$STAGING"

          # Server code, defaults, and the frontend it serves
          cp server.js "$STAGING/"
          cp -r src "$STAGING/"
          cp -r default "$STAGING/"
          cp -r public "$STAGING/"

          # Real dependency set, resolved from the root lockfile. A hand-written
          # subset WILL crash on boot (helmet, csrf-sync, ... are all required).
          cp package.json package-lock.json "$STAGING/"
          echo "${{ github.sha }}-${{ github.run_number }}" > "$STAGING/VERSION"

          cd "$STAGING"
          npm ci --omit=dev --no-audit --no-fund
          cd -

      - name: Provide Node.js runtime
        run: |
          STAGING="android/app/src/main/assets/backend"
          mkdir -p "$STAGING/nodejs"

          # Standalone Android (bionic) Node.js binaries are expected at
          # mobile-runtime/node-{arm64,armv7,x64,x86} (see ANDROID.md).
          # Linux musl builds and libnode.so CANNOT be executed by the service.
          if ls mobile-runtime/node-* >/dev/null 2>&1; then
            cp mobile-runtime/node-* "$STAGING/nodejs/"
            echo "Bundled Node.js runtime binaries:"
            ls -lh "$STAGING/nodejs/"
          else
            echo "::warning::No Node.js runtime found in mobile-runtime/. The APK will build,"
            echo "::warning::but the app will report 'No Node.js runtime bundled' on launch."
            echo "::warning::See ANDROID.md ('Node.js runtime provisioning') for how to provide one."
          fi

      - name: Verify build assets
        run: |
          STAGING="android/app/src/main/assets/backend"
          echo "=== Backend bundle ==="
          ls -lh "$STAGING" | head -n 20
          [ -f "$STAGING/server.js" ] && echo "OK server.js" || (echo "MISSING server.js" && exit 1)
          [ -d "$STAGING/src" ] && echo "OK src/" || (echo "MISSING src/" && exit 1)
          [ -d "$STAGING/public" ] && echo "OK public/" || (echo "MISSING public/" && exit 1)
          [ -d "$STAGING/node_modules" ] && echo "OK node_modules/" || (echo "MISSING node_modules/" && exit 1)
          [ -f "$STAGING/VERSION" ] && echo "OK VERSION: $(cat "$STAGING/VERSION")" || (echo "MISSING VERSION" && exit 1)
          for dep in helmet csrf-sync cookie-session multer yaml ws; do
            [ -d "$STAGING/node_modules/$dep" ] && echo "OK dep: $dep" || (echo "MISSING dep: $dep" && exit 1)
          done
          echo "=== Node.js runtime ==="
          if ls "$STAGING/nodejs"/node-* >/dev/null 2>&1; then
            ls -lh "$STAGING/nodejs/"
          else
            echo "NONE (app will fail at runtime with a clear error - see step above)"
          fi
          echo "=== Native sources ==="
          [ -f "android/app/src/main/java/com/sillytavern/app/NodeJsService.java" ] && echo "OK NodeJsService.java" || (echo "MISSING NodeJsService.java" && exit 1)
          [ -f "android/app/src/main/res/xml/file_paths.xml" ] && echo "OK file_paths.xml" || (echo "MISSING file_paths.xml" && exit 1)

      - name: Build APK (Debug)
        if: inputs.build_type == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build release artifacts (unsigned)
        if: inputs.build_type == 'release'
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign release artifacts
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not all set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          # APKs must be signed with apksigner (v2 scheme); jarsigner would break the signature.
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass:env KEYSTORE_PASSWORD --key-pass:env KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release-signed.apk

          # App bundles are signed with jarsigner.
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

          shred -u /tmp/release.keystore || rm -f /tmp/release.keystore

      - name: Run emulator tests
        if: inputs.run_emulator_tests == 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            echo "Installing APK..."
            BUILD_TYPE=${{ inputs.build_type }}
            APK_PATH=$(ls android/app/build/outputs/apk/${BUILD_TYPE}/*.apk | head -n 1)
            echo "APK: $APK_PATH"
            adb install "$APK_PATH"

            echo "Launching app..."
            adb shell am start -n com.sillytavern.app/.MainActivity

            echo "Forwarding backend port to the runner..."
            adb forward tcp:18080 tcp:8000

            echo "Polling backend health (up to 5 minutes)..."
            HEALTHY=false
            for i in $(seq 1 60); do
              if curl -sf --max-time 5 http://127.0.0.1:18080/api/health; then
                echo ""
                echo "Backend is healthy."
                HEALTHY=true
                break
              fi
              sleep 5
            done

            echo "=== logcat (SillyTavern/NodeJs) ==="
            adb logcat -d | grep -E "(SillyTavern|NodeJsService)" > emulator-logs.txt || true
            tail -n 100 emulator-logs.txt || true

            adb shell "pidof com.sillytavern.app" && echo "App process is running" || (echo "App process NOT running" && exit 1)

            if [ "$HEALTHY" != "true" ]; then
              echo "Backend never became healthy."
              echo "If the build has no Node.js runtime (see 'Provide Node.js runtime' step), this is expected."
              exit 1
            fi

      - name: Upload emulator logs
        if: inputs.run_emulator_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-${{ github.run_number }}
          path: emulator-logs.txt

      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-debug-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-release-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/release/*signed*.apk
          retention-days: 90

      - name: Upload Release AAB
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-release-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Generate build report
        if: always()
        run: |
          {
            echo "# Android Build Report"
            echo "Build Type: ${{ inputs.build_type }}"
            echo "Run Number: ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "## Artifacts"
            find android/app/build/outputs -name "*.apk" -o -name "*.aab" | while read -r f; do ls -lh "$f"; done
          } > build-report.md
          cat build-report.md

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.run_number }}
          path: build-report.md
          retention-days: 30
