name: Android Build & Test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

      run_emulator_tests:
        description: 'Run emulator tests'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Node.js binaries for Android
        run: |
          echo "Downloading Node.js Android binaries..."
          mkdir -p android/app/src/main/assets/nodejs

          NODE_VERSION="v20.11.0"

          wget -q https://unofficial-builds.nodejs.org/download/release/${NODE_VERSION}/node-${NODE_VERSION}-linux-arm64-musl.tar.gz -O /tmp/node-arm64.tar.gz
          tar -xzf /tmp/node-arm64.tar.gz -C /tmp
          cp /tmp/node-${NODE_VERSION}-linux-arm64-musl/bin/node android/app/src/main/assets/nodejs/node-arm64

          wget -q https://unofficial-builds.nodejs.org/download/release/${NODE_VERSION}/node-${NODE_VERSION}-linux-armv7l-musl.tar.gz -O /tmp/node-armv7.tar.gz
          tar -xzf /tmp/node-armv7.tar.gz -C /tmp
          cp /tmp/node-${NODE_VERSION}-linux-armv7l-musl/bin/node android/app/src/main/assets/nodejs/node-armv7

          wget -q https://unofficial-builds.nodejs.org/download/release/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64-musl.tar.gz -O /tmp/node-x64.tar.gz
          tar -xzf /tmp/node-x64.tar.gz -C /tmp
          cp /tmp/node-${NODE_VERSION}-linux-x64-musl/bin/node android/app/src/main/assets/nodejs/node-x64

          chmod +x android/app/src/main/assets/nodejs/*
          ls -lh android/app/src/main/assets/nodejs/

      - name: Bundle backend for mobile
        run: |
          echo "Creating mobile backend bundle..."
          mkdir -p android/app/src/main/assets/backend

          cp -r src android/app/src/main/assets/backend/
          cp server.js android/app/src/main/assets/backend/
          cp -r default android/app/src/main/assets/backend/

          cat > android/app/src/main/assets/backend/package.json << 'EOF'
          {
            "name": "sillytavern-mobile",
            "version": "1.18.0",
            "type": "module",
            "main": "server.js",
            "dependencies": {
              "express": "^4.21.0",
              "cors": "^2.8.5",
              "compression": "^1.8.1",
              "body-parser": "^1.20.2",
              "cookie-parser": "^1.4.6",
              "ws": "^8.18.3",
              "multer": "^2.1.1",
              "yaml": "^2.8.3"
            }
          }
          EOF

          cd android/app/src/main/assets/backend
          npm install --production --no-optional --omit=dev
          cd -

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify build assets
        run: |
          echo "Verifying Node.js binaries..."
          ls -lh android/app/src/main/assets/nodejs/

          echo "Verifying backend files..."
          ls -lh android/app/src/main/assets/backend/

          [ -f "android/app/src/main/assets/backend/server.js" ] && echo "✓ server.js found" || echo "✗ server.js missing"
          [ -d "android/app/src/main/assets/backend/src" ] && echo "✓ src/ found" || echo "✗ src/ missing"
          [ -d "android/app/src/main/assets/backend/node_modules" ] && echo "✓ node_modules found" || echo "✗ node_modules missing"

      - name: Generate debug keystore
        if: inputs.build_type == 'debug'
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK (Debug)
        if: inputs.build_type == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build APK (Release)
        if: inputs.build_type == 'release'
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        run: |
          BUILD_TYPE=${{ inputs.build_type }}
          APK_PATH="android/app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk"
          SIGNED_APK="android/app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}-signed.apk"

          if [ "$BUILD_TYPE" = "debug" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore android/app/debug.keystore \
              -storepass android -keypass android \
              $APK_PATH androiddebugkey
          fi

          echo "APK signed successfully"

      - name: Run emulator tests
        if: inputs.run_emulator_tests == 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          script: |
            echo "Starting emulator tests..."

            # Install APK
            BUILD_TYPE=${{ inputs.build_type }}
            adb install android/app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk

            # Wait for app to be installed
            sleep 5

            # Launch app
            adb shell am start -n com.sillytavern.app/.MainActivity

            # Wait for startup
            sleep 10

            # Check if Node.js server started
            echo "Checking Node.js server..."
            adb shell "curl -s http://localhost:3000/api/health" || echo "Server not responding"

            # Capture logs
            echo "Capturing logcat..."
            timeout 30 adb logcat -d | grep -E "(SillyTavern|nodejs|NodeJsService)" > emulator-logs.txt || true

            # Check for crashes
            adb shell "pidof com.sillytavern.app" && echo "✓ App is running" || echo "✗ App crashed"

            cat emulator-logs.txt

      - name: Upload emulator logs
        if: inputs.run_emulator_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: emulator-logs.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-${{ inputs.build_type }}-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          retention-days: 30

      - name: Generate build report
        if: always()
        run: |
          echo "# Android Build Report" > build-report.md
          echo "Build Type: ${{ inputs.build_type }}" >> build-report.md
          echo "Run Number: ${{ github.run_number }}" >> build-report.md
          echo "Commit: ${{ github.sha }}" >> build-report.md
          echo "" >> build-report.md
          echo "## APK Size" >> build-report.md
          find android/app/build/outputs -name "*.apk" -exec ls -lh {} \; >> build-report.md

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.run_number }}
          path: build-report.md
