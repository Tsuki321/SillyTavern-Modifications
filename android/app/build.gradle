plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sillytavern.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sillytavern.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.18.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PASSWORD")) {
                storeFile file("keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'

task downloadNodeBinary {
    doLast {
        def nodeVersion = "v20.11.0"
        def architectures = ["arm64-v8a", "armeabi-v7a", "x86_64"]

        architectures.each { arch ->
            def nodeBinaryUrl = "https://nodejs.org/dist/${nodeVersion}/node-${nodeVersion}-android-${arch}.tar.gz"
            // TODO: Download and extract Node.js binaries
            println "Would download Node.js binary for ${arch}"
        }
    }
}
